<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The real logo lockup, not a placeholder. Generated from the site's own
      markup by `node scripts/favicons.mjs` -- see that file for why it is
      rendered in a browser (the lockup is live text in Parisienne and
      Montserrat, and a favicon cannot load a web font) and why the small
      sizes carry a "VB" monogram instead of the full wordmark (a connected
      script's strokes fall under one pixel at 32px and it renders as a
      smudge -- checked directly).

      Order matters: src/test/head.test.ts reads the FIRST `rel="icon"` and
      asserts the file it points at exists with exact case, so the 32px PNG
      leads. `sizes` lets the browser pick rather than downsampling the
      largest one itself.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Via Bianca Pastificio & Ristorante - Authentic Italian dining in Greater Kailash, Delhi. Hand-crafted pastas, wood-fired classics, and a full bar by Chef Kamalika Anand." />
    <meta name="keywords" content="Italian restaurant Delhi, handmade pasta, Via Bianca, Greater Kailash dining, authentic Italian food, Chef Kamalika Anand" />
    <meta name="author" content="Via Bianca Pastificio & Ristorante" />
    <title>Via Bianca - Pastificio & Ristorante | Authentic Italian Dining in Delhi</title>

    <!--
      No <link rel="canonical"> here, on purpose. This one file is served for
      every route by public/_redirects' SPA rewrite, so a canonical here is a
      canonical on /blogs too -- telling Google that /blogs is a duplicate of
      the homepage and should not be indexed, while public/sitemap.xml asks
      for exactly the opposite. The homepage's self-canonical is rendered by
      src/components/SeoHead.tsx, which is mounted only on /. Every other
      route is left with no canonical, which is the safe default.
    -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Via Bianca - Pastificio & Ristorante" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Via Bianca - Pastificio & Ristorante" />
    <meta property="og:description" content="Via Bianca Pastificio & Ristorante - Authentic Italian dining in Greater Kailash, Delhi. Hand-crafted pastas, wood-fired classics, and a full bar by Chef Kamalika Anand." />
    <meta property="og:url" content="https://vb.aionxxxi.uk" />
    <meta property="og:image" content="https://vb.aionxxxi.uk/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Via Bianca - Pastificio & Ristorante" />
    <meta property="twitter:description" content="Via Bianca Pastificio & Ristorante - Authentic Italian dining in Greater Kailash, Delhi. Hand-crafted pastas, wood-fired classics, and a full bar by Chef Kamalika Anand." />
    <meta property="twitter:image" content="https://vb.aionxxxi.uk/og-image.jpg" />

    <!-- Preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Parisienne&family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap">
  </head>
  <body>
    <!--
      A fallback for the one failure this site has now hit three times: an
      asset served under the wrong Content-Type by a poisoned edge cache. When
      it is the entry bundle, the browser refuses to execute it, nothing
      mounts, and every visitor gets a completely blank white page with no
      indication anything is wrong -- including the owner, who has no reason
      to suspect the site is down.

      Seeded into #root and removed by src/main.tsx the moment that module
      runs, so it is only ever visible when the bundle did NOT run.

      The delay is CSS, not script: `visibility: hidden` with an animation
      that reveals it after four seconds. A normal load clears the element
      long before that, so there is no flash, and no inline script is needed
      -- which matters, because public/_headers' script-src forbids one.
    -->
    <style>
      #vb-fallback {
        visibility: hidden;
        animation: vb-reveal 0s linear 4s forwards;
        font-family: Georgia, 'Times New Roman', serif;
        max-width: 32rem;
        margin: 20vh auto 0;
        padding: 0 1.5rem;
        text-align: center;
        color: #222;
      }
      @keyframes vb-reveal { to { visibility: visible; } }
      #vb-fallback h1 { font-size: 1.5rem; font-weight: normal; margin: 0 0 0.75rem; }
      #vb-fallback p { margin: 0 0 1.25rem; line-height: 1.6; color: #555; }
      #vb-fallback a { color: #6b8b59; }
    </style>
    <div id="root">
      <div id="vb-fallback">
        <h1>Via Bianca</h1>
        <!--
          Deliberately carries no phone number or address. Every other copy of
          those on this site is rendered from site.json, and a second one
          hardcoded here could not be edited from the dashboard and would go
          stale the first time either changed -- silently, since this markup
          is invisible unless the site is already broken.
        -->
        <!--
          "Refreshing usually fixes it" was wrong for the one failure this
          message exists to cover, and wrong in the way that wastes the most
          of someone's time: they refresh, see the same screen, and conclude
          the site is dead.

          A poisoned asset is served with `max-age=31536000, immutable`
          (public/_headers), so a browser that received one has cached it for
          a YEAR and an ordinary reload will not re-request it. Only a
          cache-bypassing reload will, which is why the shortcut is spelled
          out rather than implied.

          The second sentence is the honest floor: `s-maxage` bounds the edge
          copy to an hour, and asset filenames now carry the commit
          (vite.config.ts), so the next deploy retires the bad URL outright.
          Someone who does nothing does get it back.
        -->
        <p>
          This page did not finish loading. Hold Shift and click reload, or
          press Cmd-Shift-R on a Mac, Ctrl-Shift-R elsewhere.
        </p>
        <p>
          If that does not do it, this clears itself within the hour.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      The Cloudflare Web Analytics beacon, placed by hand. This reverses what
      this comment used to say, and the reversal is measured rather than
      assumed, so the old reasoning is recorded here alongside why it no
      longer holds.

      What it used to say: Web Analytics is switched on at the Cloudflare
      Pages project level, Cloudflare therefore injects its own beacon into
      every response it serves, and a snippet here as well would put two on
      the page and double-count every visit. That was a correct description
      of what auto-install is documented to do.

      What was actually measured: auto-install is on for this site (site_tag
      29e1ba52fba74885a5fc44875a48a078, bound to the aionxxxi.uk zone) and it
      never reaches the HTML. Three cache-busted requests to the live site
      came back with no beacon in the response at all, which is why the
      dataset was empty. Cloudflare's HTML injection happens on responses the
      zone serves and is not applied to responses served by Pages -- and on
      this site every response is served by Pages. So the count being
      protected was not one, it was zero.

      The snippet also outlasts the domain. Auto-install carries the token on
      the ZONE; this carries it in the markup, so the numbers keep accruing
      to one site_tag through the eventual move to viabiancadelhi.com instead
      of restarting from nothing on the new zone.

      Auto-install is to be turned OFF in the dashboard, which is what keeps
      the old double-count worry from ever becoming real: this tag is then
      the one beacon on the page. src/test/analytics.test.ts asserts the
      COUNT rather than the presence for exactly that reason -- a duplicated
      tag passes a presence check and doubles every number she reads.
    -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "7d977bcbda6e4e38884875918d153e7f"}'></script>
  </body>
</html>
