name = "via-bianca-admin"
main = "worker/index.ts"
compatibility_date = "2026-01-01"

# Same-origin: /api/* must be served by this Worker, not by the SPA catch-all in
# public/_redirects. A cross-origin Worker would drop the SameSite=Strict session
# cookie on every fetch and make sendBeacon('/api/wa') a silent no-op.
# Both hostnames, and the list is the whole truth: `wrangler deploy` REPLACES a
# Worker's routes with exactly what is here, so a route added by hand in the
# dashboard survives until the next deploy and then disappears without a word.
# That is not hypothetical -- it happened to viabiancarestaurant.com on the 5B
# deploy, and /edit login on that host went back to 405 until this line existed.
#
# Phase 5C adds /blog/* on both hostnames: worker/post-page.ts answers a post
# URL with the SPA shell whose <head> it has rewritten for that post. Three
# things about this pattern are load-bearing.
#
#   - `/blog/*` does NOT match bare `/blog`. The index stays entirely on
#     Pages, untouched, which is the smallest widening that satisfies the
#     phase's requirement (which is about posts).
#   - It does not match `/index.html`, which is exactly why the Worker can
#     fetch the shell from Pages without recursing into itself.
#   - It cannot reach /edit, and src/test/hosting.test.ts pins that. /edit
#     deliberately emits no canonical and no structured data of its own
#     (src/components/SeoHead.tsx's own comment), and a route widened to
#     `/*` would start emitting one on its behalf.
#
# The pattern is coarser than the handler's own predicate, on purpose. Cloudflare
# route patterns cannot express "one path segment", so `/blog/a/b` and bare
# `/blog/` arrive here and get the router's 404 rather than being left to Pages.
# worker/post-page.ts's slugFromPath is the narrower half and it is the one that
# decides; do not try to make this pattern agree with it exactly.
#
# Deploying THIS list is what makes /blog/<slug> a Worker response. Reverting
# it to the two /api/* entries and re-running `npx wrangler deploy` is the
# whole rollback -- Pages answers /blog/* again immediately, and the handler is
# unreachable without a route. See docs/cloudflare-cutover.md section 20.
# vb.aionxxxi.uk was the owner's personal testing host, used before
# viabiancarestaurant.com was bought. Its routes are removed here because the
# owner is deleting the aionxxxi.uk zone from Cloudflare outright, and a
# route naming a zone absent from the account makes every future
# `npx wrangler deploy` fail. This is a route removal, not a host drop --
# the site has served canonically from viabiancarestaurant.com for a while.
routes = [
  { pattern = "viabiancarestaurant.com/api/*", zone_name = "viabiancarestaurant.com" },
  { pattern = "viabiancarestaurant.com/blog/*", zone_name = "viabiancarestaurant.com" },
]

[vars]
GITHUB_OWNER = "tarann26"
GITHUB_REPO  = "vb"
GITHUB_BRANCH = "main"   # the branch Cloudflare Pages builds from

# Identifiers, not secrets -- same non-sensitive-var treatment as
# GITHUB_OWNER/REPO above (worker/status.ts's PagesEnv owns this shape).
# Read by GET /api/build-status to ask Cloudflare's Pages deployments API
# about a specific commit. PLACEHOLDER-* strings: an agent cannot look these
# up without Cloudflare account access. A human must read the real account
# id and Pages project name from the dashboard and paste them in here before
# this Worker is deployed (see docs/cloudflare-cutover.md). src/test/wrangler-config.test.ts
# accepts either these exact placeholders or a well-formed real value (a
# 32-character hex account id; a project name that isn't the placeholder) --
# NOT exact-equality to the placeholder alone, which would mean completing
# this step (replacing the placeholder with the real value the runbook asks
# for) fails the test forever, on every push, the same way leaving it
# unset does not. An invented or half-pasted value still fails, guarding
# against build-status silently querying a nonexistent account/project.
CLOUDFLARE_ACCOUNT_ID = "e352283475b003efeab1a35e45932927"
CLOUDFLARE_PAGES_PROJECT = "vb"

# The Cloudflare Web Analytics site tag. An identifier, not a secret -- the
# same non-sensitive-var treatment CLOUDFLARE_PAGES_PROJECT above gets, and
# for the same reason: it is a FILTER VALUE. It says which site's rows to
# read; it grants nothing. The thing that actually grants read access is the
# CLOUDFLARE_API_TOKEN secret, which needs Account Analytics: Read added to
# its existing Account.Cloudflare Pages: Read before GET /api/analytics can
# return anything (worker/analytics.ts's PagesEnv/WebAnalyticsEnv split owns
# this shape).
#
# NOT a placeholder, unlike the two above were: this value was read off the
# live Cloudflare dashboard and is the same tag the beacon snippet in
# index.html carries. It is bound to the ZONE aionxxxi.uk today, and putting
# it here as well as in the HTML is what lets the data survive the eventual
# move to viabiancadelhi.com -- the tag travels with the repo rather than
# with the zone.
CF_WEB_ANALYTICS_SITE_TAG = "29e1ba52fba74885a5fc44875a48a078"

# The eventual switch. UNSET (or "github") is the default and means every
# content file that exists today is read from and written to GitHub, exactly
# as it is now -- see worker/store.ts's `storeFor`. "d1" moves all of them at
# once. The pilot file (src/content/awards.json) is on D1 either way, because
# it exists nowhere else. Flipping this is one config change with an instant
# rollback, which is the whole reason the ContentStore indirection exists.
CONTENT_STORE = "github"

# An EXPLICIT empty list, not a deleted `[triggers]` section. Those are not
# the same thing to `wrangler deploy`, and the difference is the whole reason
# this stays here.
#
# Publishing is instantaneous, so there is no future-dated content for a cron
# to wake up and notice, and worker/index.ts exports no `scheduled` handler
# for one to call. But an hourly `0 * * * *` trigger was once registered on
# the deployed `via-bianca-admin` Worker from here, and simply removing the
# lines that registered it does not remove the registration -- Cloudflare
# stores schedules on the script, not in this file. Read straight out of
# wrangler's own deploy path (node_modules/wrangler/wrangler-dist/cli.js): an
# absent section normalises to `{ crons: undefined }`, `deploy` forwards that
# as `crons`, and the only call that can clear a schedule is guarded by
# `if (crons) { ... PUT ${workerUrl}/schedules ... }`. `undefined` is falsy,
# so no request is issued and whatever Cloudflare already has survives every
# future deploy. `[]` is truthy, so the PUT fires with an empty list and
# actually clears it. Confirmed against the live Worker while the section was
# missing: its `/schedules` endpoint still reported `0 * * * *`, hours after
# the removal, with 24 failed invocations a day against a script that no
# longer had a handler to run.
#
# So: keep this. Deleting it later, once the schedule is gone, is not a
# tidy-up -- it returns this Worker to the state where a `scheduled` export
# added for some unrelated reason silently starts firing hourly again, and it
# takes the only thing in the repo that records the cleared state with it.
# src/test/wrangler-config.test.ts pins both halves (the section is present,
# and the list is empty). Putting a real cadence back would also be a
# standing charge against Pages Free's 500-build cap -- an unconditional
# hourly hook is 720-744 builds/month on its own.
[triggers]
crons = []

[[kv_namespaces]]
binding = "KV"
# PLACEHOLDER-NOT-A-REAL-NAMESPACE-ID: this cannot be created by an agent --
# it requires Cloudflare account access. A human must run
# `wrangler kv namespace create via-bianca-admin-kv` and paste the real id
# here before this Worker is deployed (see docs/cloudflare-cutover.md).
# src/test/wrangler-config.test.ts accepts either this exact placeholder or a
# well-formed real id (32 lowercase hex characters, what that command
# actually prints) -- NOT exact-equality to the placeholder alone, which
# would mean completing this step (replacing the placeholder with the real
# id) fails the test forever, on every push, exactly like never doing it at
# all. An invented or half-pasted value still fails, guarding against the
# Worker failing at runtime with an unbound KV.
id = "3e90a6b54f83487995156291801dce95"

# Phase 2. The content store the D1 path is proven on. Created by hand
# (`wrangler d1 create via-bianca-content`) for the same reason the KV id
# above was: an agent has no Cloudflare account access. A D1 database_id is a
# UUID WITH DASHES (36 characters), not the 32-character hex the KV id and
# the account id are -- src/test/wrangler-config.test.ts checks it against
# its own pattern for exactly that reason, not the HEX32 pattern used above.
#
# Free tier, verified against the live docs 2026-08-15: 5,000,000 rows
# read/day, 100,000 rows written/day, 5 GB per account, 500 MB per database,
# 10 databases. The entire current content set is 400 KB.
[[d1_databases]]
binding = "DB"
database_name = "via-bianca-content"
database_id = "7ec61770-4fb1-4458-9c34-46b92bb9702c"

# R2 is deliberately ABSENT from this file, not merely deferred by oversight.
# `wrangler r2 bucket create via-bianca-assets` failed with code 10042,
# "Please enable R2 through the Cloudflare Dashboard" -- that activation can
# require billing details, and the standing authorization does not cover
# adding a billable prerequisite without the owner's approval. Nothing in
# Phase 2 reads env.R2 either way, so there is no unexercised binding sitting
# here waiting on a bucket that does not exist.
#
# The image derivative pipeline is the reason R2 was going to be bound at
# all. The spec says it "runs on upload inside the Worker rather than at
# build time"; it cannot: scripts/images.mjs loads sharp's native binding at
# module scope and workerd cannot execute native code, and every Cloudflare
# resizing product (Images, the /cdn-cgi/image/ transform endpoint) is
# billable, which the standing authorization also forbids without the
# owner's approval. Three options are owed a decision before Phase 3:
# generate derivatives at build time and upload the results to R2; upload
# originals and resize in the browser before the request; or buy Cloudflare
# Images. R2's activation is now bundled into that same decision -- both
# arrive together in Phase 3.
