name = "via-bianca-admin"
main = "worker/index.ts"
compatibility_date = "2026-01-01"

# Same-origin: /api/* must be served by this Worker, not by the SPA catch-all in
# public/_redirects. A cross-origin Worker would drop the SameSite=Strict session
# cookie on every fetch and make sendBeacon('/api/wa') a silent no-op.
routes = [{ pattern = "vb.aionxxxi.uk/api/*", zone_name = "aionxxxi.uk" }]

[vars]
GITHUB_OWNER = "tarann26"
GITHUB_REPO  = "vb"
GITHUB_BRANCH = "main"   # the branch Cloudflare Pages builds from

# Identifiers, not secrets -- same non-sensitive-var treatment as
# GITHUB_OWNER/REPO above (worker/status.ts's PagesEnv owns this shape).
# Read by GET /api/build-status to ask Cloudflare's Pages deployments API
# about a specific commit. PLACEHOLDER-* strings: an agent cannot look these
# up without Cloudflare account access. A human must read the real account
# id and Pages project name from the dashboard and paste them in here before
# this Worker is deployed (see docs/cloudflare-cutover.md). src/test/wrangler-config.test.ts
# accepts either these exact placeholders or a well-formed real value (a
# 32-character hex account id; a project name that isn't the placeholder) --
# NOT exact-equality to the placeholder alone, which would mean completing
# this step (replacing the placeholder with the real value the runbook asks
# for) fails the test forever, on every push, the same way leaving it
# unset does not. An invented or half-pasted value still fails, guarding
# against build-status silently querying a nonexistent account/project.
CLOUDFLARE_ACCOUNT_ID = "e352283475b003efeab1a35e45932927"
CLOUDFLARE_PAGES_PROJECT = "vb"

# No `[triggers]` block, deliberately: publishing is instantaneous, so there
# is no future-dated content for a cron to wake up and notice, and
# worker/index.ts exports no `scheduled` handler for one to call. Adding a
# cron back here would be a standing charge against Pages Free's 500-build
# cap (an unconditional hourly hook is 720-744 builds/month on its own) in
# exchange for nothing.

[[kv_namespaces]]
binding = "KV"
# PLACEHOLDER-NOT-A-REAL-NAMESPACE-ID: this cannot be created by an agent --
# it requires Cloudflare account access. A human must run
# `wrangler kv namespace create via-bianca-admin-kv` and paste the real id
# here before this Worker is deployed (see docs/cloudflare-cutover.md).
# src/test/wrangler-config.test.ts accepts either this exact placeholder or a
# well-formed real id (32 lowercase hex characters, what that command
# actually prints) -- NOT exact-equality to the placeholder alone, which
# would mean completing this step (replacing the placeholder with the real
# id) fails the test forever, on every push, exactly like never doing it at
# all. An invented or half-pasted value still fails, guarding against the
# Worker failing at runtime with an unbound KV.
id = "3e90a6b54f83487995156291801dce95"
